name: Deploy to AWS Amplify

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to Amplify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          # Add any environment variables needed for build
          NEXT_PUBLIC_ONCHAINDB_ENDPOINT: ${{ secrets.ONCHAINDB_ENDPOINT }}
          NEXT_PUBLIC_APP_ID: ${{ secrets.ONCHAINDB_APP_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start Amplify deployment
        run: |
          aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name ${{ github.ref_name }} \
            --job-type RELEASE

      - name: Wait for deployment
        run: |
          echo "Deployment started. Check AWS Amplify console for status."
          echo "App URL: https://${{ github.ref_name }}.${{ secrets.AMPLIFY_APP_ID }}.amplifyapp.com"